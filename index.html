<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Three O Clock | Bhilai</title>
  <meta name="description" content="Chhattisgarh & Bhilai’s First Authentic Vietnamese Coffee Global Flavours • Signature Appetizers Let’s Meet Over Coffee">
  
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-wrapper">
    <main class="profile-card">
      
      <!-- Three O'Clock Profile Section -->
      <section class="profile-section">
        <div class="profile-avatar-wrapper">
          <img src="threelogo.jpeg" alt="Three O'Clock | Bhilai" class="profile-avatar-img">
        </div>

        <h1 class="profile-title">Three O Clock | Bhilai</h1>

        <p class="profile-description">
          Chhattisgarh &amp; Bhilai’s First Authentic Vietnamese Coffee Global<br class="desktop-br">
          Flavours • Signature Appetizers Let’s Meet Over Coffee 👇
        </p>

        <!-- Instagram Outline Icon centered under description -->
        <a href="https://www.instagram.com/threeoclockbhilai" 
           target="_blank" 
           rel="noopener noreferrer" 
           class="instagram-outline-link" 
           aria-label="Instagram Profile" 
           title="Instagram">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
          </svg>
        </a>
      </section>

      <!-- Three Pill-Shaped Link Buttons (compact, three dots removed) -->
      <section class="links-section">
        
        <!-- Link 1: Google Reviews -->
        <a href="https://search.google.com/local/writereview?placeid=ChIJcdh4oCY9KToRi_cyQvy65fw" 
           target="_blank" 
           rel="noopener noreferrer" 
           class="link-button" 
           id="btn-google-reviews">
          <div class="link-icon-container">
            <img src="google.svg" alt="Google Review" class="link-icon">
          </div>
          <span class="link-text">Review Here ! Google Review</span>
        </a>

        <!-- Link 2: Instagram -->
        <a href="https://www.instagram.com/threeoclockbhilai" 
           target="_blank" 
           rel="noopener noreferrer" 
           class="link-button" 
           id="btn-instagram">
          <div class="link-icon-container logo-circle">
            <img src="threelogo.jpeg" alt="Three O'Clock Profile" class="link-icon three-btn-logo">
          </div>
          <span class="link-text">Instagram</span>
        </a>

        <!-- Link 3: Menu -->
        <a href="https://drive.google.com/file/d/1rlfufweBwF9gA6dGLnmCmUCYzm4cpjlQ/view?usp=drivesdk" 
           target="_blank" 
           rel="noopener noreferrer" 
           class="link-button" 
           id="btn-printed-menu">
          <div class="link-icon-container circle-white">
            <img src="menulogo.jpeg" alt="Menu" class="link-icon menu-btn-logo">
          </div>
          <span class="link-text">Click For Menu 🍽️</span>
        </a>

      </section>

      <!-- SoberStuds Whole Logo in Center Bottom (Clickable WhatsApp Link) -->
      <footer class="card-footer">
        <a href="https://wa.me/919243334046?text=Hey%20I%20want%20to%20enquire%20about%20tap%20to%20review%20product" 
           target="_blank" 
           rel="noopener noreferrer" 
           class="footer-brand-container"
           aria-label="Enquire about tap to review product on WhatsApp"
           title="Enquire on WhatsApp: Hey I want to enquire about tap to review product">
          <img src="logo.png" alt="SoberStuds" class="footer-full-logo">
        </a>
      </footer>

    </main>
  </div>
</body>
</html>
